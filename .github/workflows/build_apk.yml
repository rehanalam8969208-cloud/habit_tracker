name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Generate Android Code
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.rehan.habit

      - name: Inject Unique Glass Logo
        run: |
          # Delete default Flutter logos completely
          rm -rf android/app/src/main/res/mipmap-*
          # Point manifest to our new drawable logo
          sed -i 's/@mipmap\/ic_launcher/@drawable\/ic_launcher/g' android/app/src/main/AndroidManifest.xml
          # Create our custom Vector Logo
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0F172A" android:pathData="M0,0 h108 v108 h-108 z"/>
              <path android:fillColor="#10B981" android:pathData="M54,15 l35,39 l-35,39 l-35,-39 z"/>
              <path android:fillColor="#3B82F6" android:pathData="M54,30 l20,24 l-20,24 l-20,-24 z"/>
          </vector>
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LevelUp-Glass-Edition
          path: 'build/app/outputs/**/*.apk'
