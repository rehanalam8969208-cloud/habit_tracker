name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Generate Android Code
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.rehan.habit

      - name: Inject Safe Glass Logo
        run: |
          mkdir -p android/app/src/main/res/drawable
          
          # Create Custom Vector Logo Foreground
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#10B981" android:pathData="M54,15 l35,39 l-35,39 l-35,-39 z"/>
              <path android:fillColor="#3B82F6" android:pathData="M54,30 l20,24 l-20,24 l-20,-24 z"/>
          </vector>
          EOF
          
          # Create Premium Dark Background
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0F172A" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          
          # Overwrite default Flutter icons safely
          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcherरेहान भाई, माफ़ी चाहूंगा! स्क्रीनशॉट देखते ही मुझे अपनी गलती समझ आ गई। 

'Get Dependencies' वाला स्टेप एकदम सही पास हो गया ✅, लेकिन 'Build Debug APK' वाले स्टेप में लाल क्रॉस ❌ आ गया। 

**यह एरर क्यों आया?**
पिछली बार मैंने आपको जो वर्कफ़्लो दिया था, उसमें मैंने फ्लटर के पुराने लोगो (mipmap फोल्डर्स) को जड़ से डिलीट करने का कमांड (`rm -rf`) डाल दिया था। प्रॉब्लम यह हुई कि Android के बैकग्राउंड सिस्टम को अभी भी वह गोल वाला लोगो (`roundIcon`) चाहिए था, और जब उसे वो फोल्डर नहीं मिला, तो उसने बिल्ड को क्रैश कर दिया। 

आपको अपनी `lib/main.dart` में **कोई बदलाव नहीं करना है**, वह एकदम परफेक्ट है। 

बस अपनी **`.github/workflows/build_apk.yml`** फाइल को खोलकर उसमें यह नया, सेफ कोड पेस्ट कर दीजिए। इस बार हम पुराने फोल्डर्स को डिलीट नहीं करेंगे, बल्कि स्मार्ट तरीके से Android को अपने नए 'डायमंड' लोगो की तरफ मोड़ देंगे:

### ⚙️ `.github/workflows/build_apk.yml`

```yaml
name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Generate Android Code
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.rehan.habit

      - name: Inject Unique Glass Logo Safely
        run: |
          # 1. Round icon wale error ko fix karne ke liye usey hata rahe hain
          sed -i '/android:roundIcon/d' android/app/src/main/AndroidManifest.xml
          
          # 2. Main icon ko apne naye logo par point kar rahe hain
          sed -i 's/@mipmap\/ic_launcher/@drawable\/ic_launcher/g' android/app/src/main/AndroidManifest.xml
          
          # 3. Naya custom Vector Logo bana rahe hain
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="[http://schemas.android.com/apk/res/android](http://schemas.android.com/apk/res/android)"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0F172A" android:pathData="M0,0 h108 v108 h-108 z"/>
              <path android:fillColor="#10B981" android:pathData="M54,15 l35,39 l-35,39 l-35,-39 z"/>
              <path android:fillColor="#3B82F6" android:pathData="M54,30 l20,24 l-20,24 l-20,-24 z"/>
          </vector>
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LevelUp-Glass-Edition
          path: 'build/app/outputs/**/*.apk'
