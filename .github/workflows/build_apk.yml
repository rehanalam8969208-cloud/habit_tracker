name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Clean & Fix Android SDK
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.rehan.habit
          # Yeh line Android SDK mismatch error (Exit Code 1) ko fix karegi
          sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
          
      - run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --debug
        
      - uses: actions/upload-artifact@v4
        with:
          name: LevelUp-App
          path: build/app/outputs/flutter-apk/app-debug.apk
